[project]
name = "translate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "biao.zhu", email = "biao.zhu@dbappsecurity.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.23.0",
    "litellm>=1.81.1",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
translate = "translate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translate"]